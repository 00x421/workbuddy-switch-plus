<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>用户中心 · WorkBuddy</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/me/assets/me.css">
</head>
<body>

<!--
  ⚠️⚠️ 本页必须保持「纯骨架」：**不得内联任何与身份有关的数据**
  （邮箱、uid、余额、密钥、站点名、用户数、用量……）。

  硬约束（t4 立下、t25 继承）：本页对**匿名 / 用户1 / 用户2 三种身份返回的
  HTML 逐字节相同**（sha256 一致）。所有数据由 me.js 运行时经 /me/api/* 取。
  为什么要这么严：一旦在 HTML 里内联了谁的邮箱或余额，
  它就成了一份「可以被缓存、被代理、被截图」的静态副本，
  而页面本身是无状态渲染的 —— 泄漏与否就取决于这一条纪律。

  跳转规则（服务端不做 302，全部由 JS 决定）：
    · 未登录 -> location.replace("/login")
    · 已登录 -> 留在本页渲染
  ⚠️ 服务端**绝不能**在这里做 302：老客户端带 Bearer key 直连时没有 cookie，
     服务端一 302 就把它们全部挡在门外（t4 的教训，见 account-contract §8）。
-->

<div class="boot" id="boot">
  <span class="brand-symbol">w<span>&#8599;</span></span>
  <p>正在载入用户中心…</p>
</div>

<!-- 未登录/加载失败时显示。默认隐藏，由 JS 决定是否展示。 -->
<main class="me-page" id="me-page" hidden>
  <header class="me-top">
    <a class="brand" href="/me">
      <span class="brand-symbol">w<span>&#8599;</span></span>
      <span class="brand-text">WORKBUDDY<small>用户中心</small></span>
    </a>
    <div class="me-top-right">
      <span class="who" id="me-who"></span>
      <button type="button" class="btn ghost sm" id="sign-out">退出登录</button>
    </div>
  </header>

  <div id="me-notice" class="banner" hidden></div>

  <section class="me-cards" id="me-cards">
    <article class="card">
      <p class="card-label">余额</p>
      <p class="card-value" id="me-balance">—</p>
      <p class="card-hint" id="me-balance-hint">积分</p>
    </article>
    <article class="card">
      <p class="card-label">调用次数</p>
      <p class="card-value" id="me-calls">—</p>
      <p class="card-hint">近 30 天</p>
    </article>
    <article class="card">
      <p class="card-label">消耗 Token</p>
      <p class="card-value" id="me-tokens">—</p>
      <p class="card-hint">近 30 天</p>
    </article>
    <article class="card">
      <p class="card-label">我的密钥</p>
      <p class="card-value" id="me-key-count">—</p>
      <p class="card-hint">张</p>
    </article>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>兑换充值码</h2>
      <p class="muted">兑换后立即计入余额，随时可用。</p>
    </div>
    <form id="redeem-form" class="redeem-form" novalidate>
      <input id="redeem-code" type="text" name="code" autocomplete="off" spellcheck="false"
             placeholder="WB-XXXXX-XXXXX-XXXXX-XXXXX">
      <button type="submit" class="btn primary" id="redeem-submit">兑换</button>
    </form>
    <p id="redeem-error" class="field-error" hidden></p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>我的 API 密钥</h2>
      <p class="muted">密钥明文只在创建时显示一次，这里只给前缀用于辨认。</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>名称</th><th>前缀</th><th>状态</th><th class="align-right">已用 Token</th></tr></thead>
        <tbody id="me-keys-body"></tbody>
      </table>
      <div class="empty" id="me-keys-empty" hidden>
        <p>名下还没有 API 密钥。</p>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>最近流水</h2>
      <p class="muted">充值、兑换与消费记录。</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>类型</th><th>变动</th><th class="align-right">余额</th></tr></thead>
        <tbody id="me-flows-body"></tbody>
      </table>
      <div class="empty" id="me-flows-empty" hidden>
        <p>还没有流水记录。</p>
      </div>
    </div>
  </section>
</main>

<script src="/me/assets/me.js"></script>
</body>
</html>
