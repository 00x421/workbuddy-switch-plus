<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>登录 · WorkBuddy</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/login/assets/login.css">
</head>
<body>

<!--
  ⚠️ 本页必须保持「纯骨架」：不得内联任何与身份有关的数据
  （邮箱、uid、余额、密钥、站点名、用户数……）。
  原因见 _design/t4.md 与队长裁定：用户侧页面「无论谁、无论登没登录，
  返回的 HTML 逐字节相同」—— 数据一律由 login.js 运行时取。
  （原先是 /login 与 /portal/ 两个页面；2026-10 /portal/ 已删除，
   同一条规则现在适用于 /login 与 /register。）

  跳转规则（服务端不做 302，全部由 JS 决定）：
    · 已登录 → **留在本页**，由 login.js 切成「已登录」态（/portal/ 已删除）
    · 未登录 → 留在本页
  即：**本页不再发生任何跳转**。

  注册已拆到独立页 /register。本页不再做任何「注册入口是否被锁」的判断 ——
  那件事由 /register 自己负责：藏入口挡不住直接敲 URL 的人。
-->

<main class="auth-page">
  <section class="auth-card">
    <header class="auth-head">
      <span class="eyebrow">WORKBUDDY</span>
      <h1 class="auth-title">登录你的账户</h1>
      <p class="auth-sub" id="auth-sub">用邮箱和密码登录，查看额度、用量与流水。</p>
    </header>

    <!-- 顶部横幅：会话过期等全局提示 -->
    <div id="notice" class="banner" hidden></div>

    <!-- ── 登录 ─────────────────────────────────────────────── -->
    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="login-email">邮箱</label>
        <input id="login-email" type="email" name="email" autocomplete="username"
               spellcheck="false" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="login-password">密码</label>
        <input id="login-password" type="password" name="password"
               autocomplete="current-password" placeholder="至少 8 位" required>
      </div>
      <p id="login-error" class="field-error" hidden></p>
      <button type="submit" class="btn primary block" id="login-submit">登录</button>
    </form>

    <!-- 已登录状态（/portal/ 删除后，登录成功不再跳走，改为在本页展示）。
         内容由 login.js 的 showSignedIn() 填，不用 innerHTML。 -->
    <div id="signed-in" class="locked-box" hidden>
      <p class="locked-title">已登录</p>
      <p class="locked-reason" id="signed-in-email"></p>
      <p class="hint">正在前往<a href="/me">用户中心</a>…如果没跳转，<a id="to-me" href="/me">点这里</a>。</p>
      <p><button type="button" class="btn ghost" id="sign-out" hidden>退出登录</button></p>
    </div>

    <p class="auth-foot" id="foot-register">
      还没有账户？<a href="/register" id="to-register">注册 →</a>
    </p>
    <!-- 管理员入口：克制的小字链接，不是第二个主按钮。
         为什么未登录态也要放：管理员打开 /login 时是**未登录**的，
         已登录态里那个链接他根本看不到 —— 入口对他等于不存在。
         普通用户看到也不该以为这是该点的主按钮（故用 small + muted）。 -->
    <p class="auth-foot admin-entry">
      <a href="/admin/" id="to-admin">管理员？进入管理后台 →</a>
    </p>
  </section>

  <aside class="auth-aside" aria-hidden="false">
    <h2>这个账户能做什么</h2>
    <ul class="feature-list">
      <li><span class="dot"></span><div><strong>查看余额与用量</strong><small>请求次数、Token、消耗积分一目了然。</small></div></li>
      <li><span class="dot"></span><div><strong>兑换充值码</strong><small>兑换后立即计入余额，随时可用。</small></div></li>
      <li><span class="dot"></span><div><strong>管理你的密钥</strong><small>查看名下 API Key 的状态与归属。</small></div></li>
    </ul>
    <p class="aside-fine">账户用于查看自己的用量与余额。调用接口仍然使用 API Key。</p>
  </aside>
</main>

<script src="/login/assets/login.js"></script>
</body>
</html>
