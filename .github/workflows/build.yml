# 二改：本工作流已改为**仅手动触发**（Actions 页面 → Run workflow）。
#
# 原自动触发条件已停用，原因：本项目不使用 GitHub Actions 构建产物，
# 由作者本地构建后手工上传到 Release。停用自动触发后：
#   · push 代码 与 打版本标签 都不会再跑本工作流；
#   · 手动运行时的输入参数、构建步骤与产物上传逻辑**全部保留不变**。
#
# 如需恢复自动触发，把下面 `on:` 段替换回备份即可：
#   _hyact_work/_backup_before_ci_narrowing/build.yml
#   _hyact_work/_backup_before_ci_narrowing/test.yml

name: build

on:
  # 二改：原为 `push: tags: ["v*"]`，已停用（不使用 CI 构建产物）。
  # 恢复时取消注释并把 `workflow_dispatch:` 保留即可。
  # push:
  #   tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build. win-x64 produces a test installer without a GitHub Release."
        type: choice
        default: all
        options:
          - all
          - win-x64
          # 以下平台已停用（只做 Windows x64）。恢复时把矩阵里对应段一并取消注释。
          # - mac-arm64
          # - mac-x64
          # - linux-x64

permissions:
  contents: write

jobs:
  select-matrix:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          # 二改：只构建 Windows x64。macOS / Linux 段整段注释保留，恢复时取消注释即可。
          all_platforms = [
          #               {
          #                   "name": "mac-arm64",
          #                   "os": "macos-14",
          #                   "target": "aarch64-apple-darwin",
          #                   "cli_bin": "wb-switch-darwin-arm64",
          #                   "platform_tag": "darwin-arm64",
          #                   "bundles": "app",
          #                   "update_os": "macos",
          #                   "update_arch": "aarch64",
          #                   "update_bundle": "macos",
          #                   "update_archive_name": "wb-switch-plus-macos-aarch64.app.tar.gz",
          #               },
          #               {
          #                   "name": "mac-x64",
          #                   "os": "macos-14",
          #                   "target": "x86_64-apple-darwin",
          #                   "cli_bin": "wb-switch-darwin-x64",
          #                   "platform_tag": "darwin-x64",
          #                   "bundles": "app",
          #                   "update_os": "macos",
          #                   "update_arch": "x86_64",
          #                   "update_bundle": "macos",
          #                   "update_archive_name": "wb-switch-plus-macos-x86_64.app.tar.gz",
          #               },
              {
                  "name": "win-x64",
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "cli_bin": "wb-switch-win32-x64.exe",
                  "platform_tag": "win32-x64",
                  "bundles": "nsis",
                  "update_os": "windows",
                  "update_arch": "x86_64",
                  "update_bundle": "nsis",
                  "update_archive_name": "wb-switch-plus-windows-x86_64-setup.exe",
              },
          #               {
          #                   "name": "linux-x64",
          #                   "os": "ubuntu-latest",
          #                   "target": "x86_64-unknown-linux-gnu",
          #                   "cli_bin": "wb-switch-linux-x64",
          #                   "platform_tag": "linux-x64",
          #                   "bundles": "deb,appimage",
          #                   "update_os": "linux",
          #                   "update_arch": "x86_64",
          #                   "update_bundle": "appimage",
          #                   "update_archive_name": "wb-switch-plus-linux-x86_64.AppImage",
          #               },
          ]
          event = os.environ.get("EVENT_NAME", "")
          platform = (os.environ.get("PLATFORM") or "all").strip()
          if event != "workflow_dispatch" or platform in ("", "all"):
              selected = all_platforms
          else:
              selected = [p for p in all_platforms if p["name"] == platform]
              if not selected:
                  raise SystemExit(f"unknown platform: {platform}")
          matrix = json.dumps({"include": selected})
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix<<EOF\n")
              f.write(matrix + "\n")
              f.write("EOF\n")
          PY

  build:
    name: ${{ matrix.name }}
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # 该 action 默认给 RUSTFLAGS 加 -D warnings，会把 vendor/agent-companion
          # 快照在 linux cfg 下的 dead_code 告警升级成错误。发版构建不需要这层门禁
          # （自有代码的告警由 test.yml 的 lint job 把关）。
          rustflags: ""

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

          #       - name: Install Linux system dependencies
          #         if: runner.os == 'Linux'
          #         run: |
          #           sudo apt-get update
          #           sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

          #       # dmgbuild writes Finder metadata without opening Finder, so DMGs keep
          #       # their large icons and drag arrow in headless macOS runners.
          #       - name: Set up Python for dmgbuild
          #         if: runner.os == 'macOS'
          #         uses: actions/setup-python@v5
          #         with:
          #           python-version: '3.12'

          #       - name: Install dmgbuild (macOS only)
          #         if: runner.os == 'macOS'
          #         shell: bash
          #         run: |
          #           DMGBUILD_VENV="$RUNNER_TEMP/dmgbuild-venv"
          #           python3 -m venv "$DMGBUILD_VENV"
          #           "$DMGBUILD_VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
          #             "dmgbuild==1.6.7"
          #           echo "$DMGBUILD_VENV/bin" >> "$GITHUB_PATH"

      - name: Set up Python for reverse-proxy
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 反代服务（Windows 单文件 exe）。tauri.windows.conf.json 把它声明成 bundle 资源，
      # 而 `resources` 里声明过的路径**必须存在**，缺文件 tauri build 会直接报错退出；
      # 所以它必须在「Build desktop app」之前产出。macOS/Linux 不声明该资源（也因此
      # 不需要任何 Python 侧构建），这是四平台能同时跑绿的前提。
      - name: Build reverse-proxy service
        if: runner.os == 'Windows' && vars.PUBLISH_APP != 'false'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r reverse-proxy/requirements.txt pyinstaller
          ( cd reverse-proxy && python build-exe.py )
          test -f reverse-proxy/dist/wb-reverse-proxy.exe
          ls -la reverse-proxy/dist/

      # 前端构建产物（CLI 二进制 rust-embed 嵌入 + Tauri App 使用）
      #
      # 二改修复：这里原本是 `npm run build`，但 tauri.conf.json 的
      # beforeBuildCommand 是 `npm run build:desktop`，两者不等价 ——
      # `build` 只做 demo 版的 `prepare-companion-demo.mjs clean` + tsc + vite；
      # `build:desktop` 才会先编译 Agent Companion 的 Rust 运行时并拷进 dist。
      # 缺了 companion 资源时打包不会报错，只会让悬浮窗运行时一片空白、
      # 且永久点击穿透（空白页不上报命中区域），属于静默故障。
      - name: Build frontend
        run: |
          npm install
          npm run build:desktop

      # CLI 二进制
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-switch-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin

      # 打包本平台包并发布到 npm（CLI 二进制走 npm registry，Release 只留桌面 App）
      # 二改版默认**关闭**：npm 上那批 workbuddy-switch-* 包是上游的作用域，要发必须先在
      # 仓库 Settings → Variables 里显式设 PUBLISH_NPM=true，并配好自己的 NPM_TOKEN
      # secret（以及把 5 个平台包改名到你自己的作用域）。没配就整体跳过，
      # Release 的桌面 App 照样出。
      - name: Publish platform package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_DIR="npm/platform/workbuddy-switch-${{ matrix.platform_tag }}"
          # 用 tag 版本同步 platform 包版本（git 里的可能滞后）
          VER="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/\"version\": \"[0-9.]+\"/\"version\": \"$VER\"/" "$PKG_DIR/package.json"
          mkdir -p "$PKG_DIR/bin"
          SRC="target/${{ matrix.target }}/release/wb-switch"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "$PKG_DIR/bin/${{ matrix.cli_bin }}"
          cd "$PKG_DIR"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

      # 桌面 App（mac app / nsis exe / deb + AppImage）
      # 仓库变量 PUBLISH_APP=false 时整段跳过：纯 npm/CLI 改动可只发 npm 不发桌面 App；
      # 恢复为 true 后重跑本工作流即可幂等补发（与 PUBLISH_NPM 对称）。
      - name: Build desktop app
        if: vars.PUBLISH_APP != 'false'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          # cargo cache 会保留旧 NSIS/DMG/AppImage；不清理就会把 0.1.17 一类产物带进 Release。
          rm -rf "$BUNDLE_ROOT"
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          echo "bundle after build:"
          find "$BUNDLE_ROOT" -type f | sort || true
          if [ "${{ matrix.bundles }}" = "nsis" ]; then
            STALE=$(find "$BUNDLE_ROOT" -type f -name '*-setup.exe' ! -name "WB-Switch-Plus_${VER}_x64-setup.exe" || true)
            if [ -n "$STALE" ]; then
              echo "error: stale Windows installer still present:" >&2
              printf '%s\n' "$STALE" >&2
              exit 1
            fi
            test -f "$BUNDLE_ROOT/nsis/WB-Switch-Plus_${VER}_x64-setup.exe"
          fi
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' \) \
            -exec cp {} dist-bin/ \;
          # mac：纯命令行打 dmg（CI 无 Finder，Tauri 自带的 bundle_dmg.sh 会失败）
          # 二改：矩阵已无 macOS 项，本分支恒不命中；保留以备恢复。
          if [ "${{ matrix.bundles }}" = "app" ]; then
            sh scripts/make-dmg.sh "$VER" "${{ matrix.update_arch }}" "target/${{ matrix.target }}/release/bundle/macos/WB-Switch-Plus.app"
            cp "wb-switch-plus_${VER}_${{ matrix.update_arch }}.dmg" dist-bin/
          fi

      - name: Generate updater manifest
        if: matrix.update_arch != '' && vars.PUBLISH_APP != 'false'
        shell: bash
        env:
          UPDATE_OS: ${{ matrix.update_os }}
          UPDATE_ARCH: ${{ matrix.update_arch }}
          UPDATE_ARCHIVE_NAME: ${{ matrix.update_archive_name }}
          BUNDLE_DIR: target/${{ matrix.target }}/release/bundle/${{ matrix.update_bundle }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "updater bundle dir: $BUNDLE_DIR (version $VER)"
          ls -la "$BUNDLE_DIR" || true
          # 二改：矩阵已无 Linux 项，本分支恒不命中；保留以备恢复。
          if [ "$UPDATE_OS" = "linux" ]; then
            # linux 有 deb / AppImage 两种安装形态：各自收集归档与签名，再生成两份 manifest。
            # 本分支自行完成全部产物收集，不走下方 macOS/Windows 的公共尾部。
            LINUX_ROOT="$(dirname "$BUNDLE_DIR")"
            APPIMAGE="$(find "$LINUX_ROOT/appimage" -maxdepth 1 -type f -name '*.AppImage' | sort)"
            DEB="$(find "$LINUX_ROOT/deb" -maxdepth 1 -type f -name '*.deb' | sort)"
            APPIMAGE_COUNT=$(printf '%s\n' "$APPIMAGE" | sed '/^$/d' | wc -l | tr -d ' ')
            DEB_COUNT=$(printf '%s\n' "$DEB" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$APPIMAGE_COUNT" != 1 ] || [ "$DEB_COUNT" != 1 ]; then
              echo "error: expected exactly 1 .AppImage and 1 .deb, found $APPIMAGE_COUNT / $DEB_COUNT" >&2
              printf 'appimage: %s\ndeb: %s\n' "$APPIMAGE" "$DEB" >&2
              exit 1
            fi
            if [ ! -f "$APPIMAGE.sig" ] || [ ! -f "$DEB.sig" ]; then
              echo "error: missing signature for $APPIMAGE or $DEB" >&2
              exit 1
            fi
            cp "$APPIMAGE" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.AppImage"
            cp "$APPIMAGE.sig" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.AppImage.sig"
            cp "$DEB" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.deb"
            cp "$DEB.sig" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.deb.sig"
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=appimage \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-appimage linux-${UPDATE_ARCH}" \
              UPDATE_ARCHIVE_NAME="wb-switch-plus-linux-${UPDATE_ARCH}.AppImage" \
              UPDATE_JSON_NAME="latest-linux-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/appimage" sh scripts/gen-update-json.sh
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=deb \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-deb" \
              UPDATE_ARCHIVE_NAME="wb-switch-plus-linux-${UPDATE_ARCH}.deb" \
              UPDATE_JSON_NAME="latest-linux-deb-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/deb" sh scripts/gen-update-json.sh
            cp "$LINUX_ROOT/appimage/latest-linux-${UPDATE_ARCH}.json" dist-bin/
            cp "$LINUX_ROOT/deb/latest-linux-deb-${UPDATE_ARCH}.json" dist-bin/
            exit 0
          fi
          # 二改：当前只有 Windows 走这里；mac 分支在上面已说明。
          if [ "$UPDATE_OS" = "windows" ]; then
            ARCHIVE="$BUNDLE_DIR/WB-Switch-Plus_${VER}_x64-setup.exe"
          else
            ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' | sort)"
            COUNT=$(printf '%s\n' "$ARCHIVE" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" != 1 ]; then
              echo "error: expected exactly 1 .app.tar.gz, found $COUNT" >&2
              printf '%s\n' "$ARCHIVE" >&2
              exit 1
            fi
          fi
          if [ ! -f "$ARCHIVE" ] || [ ! -f "$ARCHIVE.sig" ]; then
            echo "error: missing signed updater archive ($ARCHIVE)" >&2
            exit 1
          fi
          cp "$ARCHIVE" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$ARCHIVE.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          if [ "$UPDATE_OS" = "windows" ]; then
            cmp -s "dist-bin/$UPDATE_ARCHIVE_NAME" "dist-bin/WB-Switch-Plus_${VER}_x64-setup.exe"
          fi
          UPDATE_VERSION="$VER" sh scripts/gen-update-json.sh
          MANIFEST="$BUNDLE_DIR/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/

      - uses: actions/upload-artifact@v4
        if: vars.PUBLISH_APP != 'false'
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  # 所有平台包发布成功后，发布主包（optionalDependencies 引用平台包）。
  # 与上面同一条开关：默认关闭，PUBLISH_NPM=true 才发。
  publish-main:
    name: Publish npm main package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_APP != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge updater manifests
        env:
          # 缺平台是静默故障（Linux 曾因此 18 个版本收不到更新），合并后强制校验键齐全
          REQUIRED_PLATFORMS: windows-x86_64-nsis,windows-x86_64
        run: python3 scripts/merge-update-manifests.py artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
